upstream oauth-management {
    server oauth-management:3000;
}

server {
    listen 80;
    server_name _;

    location /manage {
        proxy_pass http://oauth-management;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
