upstream oauth-api {
    server oauth-api:3000;
}

upstream oauth-management {
    server oauth-management:3000;
}

server {
    listen 80;
    server_name localhost;

    location /api {
        proxy_pass http://oauth-api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /management {
        proxy_pass http://oauth-management;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
