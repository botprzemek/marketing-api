[package]
name = "oauth-api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "oauth-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.8", features = ["json"] }
blake3 = "1.8.3"
faker_rand = "0.1.1"
rand = "0.8.5"
serde = { version = "1.0.2", features = ["derive"] }
serde_json = "1.0.0"
scylla = "1.5"
tokio = { version = "1.12", features = ["full"] }
thiserror = "2.0.18"
tower-http = { version = "0.6.8", features = ["cors"] }
futures = "0.3.6"
uuid = { version = "1.0", features = ["serde", "v7"] }
bigdecimal = "0.4"
num-bigint = "0.3"
tracing = "0.1.36"
tracing-subscriber = { version = "0.3.14", features = ["env-filter"] }
deadpool-redis = "0.23.0"
