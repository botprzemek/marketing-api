networks:
  default:
    name: oauth
    ipam:
      config:
        - subnet: 10.0.0.0/27
          ip_range: 10.0.0.0/27
          gateway: 10.0.0.1

volumes:
  database-data:
  cache-data:

services:
  database:
    image: scylladb/scylla:latest
    container_name: oauth-database
    user: 0:0
    command: [
      "--overprovisioned", "1",
      "--smp", "1",
      "--memory", "750M",
      "--developer-mode", "1"
    ]
    environment:
      SCYLLA_ENABLE_AUTH: "false"
    expose:
      - "9042"
    ports:
      - "9042:9042"
    volumes:
      - database-data:/var/lib/scylla
    healthcheck:
      test: ["CMD", "cqlsh", "localhost", "9042", "-e", "DESCRIBE KEYSPACES"]
      interval: 10s
      timeout: 5s
      retries: 10

  cache:
    image: valkey/valkey:latest
    container_name: oauth-cache
    entrypoint: valkey-server --appendonly yes
    expose:
      - "6379"
    ports:
      - "6379:6379"
    volumes:
      - cache-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-h", "127.0.0.1", "-p", "6379", "PING"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

