name: Build and publish Docker image

on:
  push:
    branches: [test/workflow]
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

concurrency: production

jobs:
  release:
    name: Tag and create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
      part: ${{ steps.version.outputs.part }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bump release version and push tag
        id: version
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_API_TAGGING: true
          WITH_V: false
          INITIAL_VERSION: 0.1.0
          DEFAULT_BUMP: patch
          DEFAULT_BRANCH: main
          RELEASE_BRANCHES: main

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          body: ${{ steps.version.outputs.changelog }}

  publish:
    name: Build and publish Docker image to GitHub Packages
    needs: release
    if: needs.release.outputs.part != 'patch'
    runs-on: ${{ matrix.os }}
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}},value=${{ needs.release.outputs.new_tag }}
          flavor: latest=auto

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.arch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 1
        with:
          platforms: linux/${{ matrix.arch }}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ needs.release.outputs.new_tag }}
            ghcr.io/${{ github.repository }}/api:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      
      - name: Build and push Management Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./management
          file: ./management/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/management:${{ needs.release.outputs.new_tag }}
            ghcr.io/${{ github.repository }}/management:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha  
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false